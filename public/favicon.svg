<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#0f172a" />
  <!-- Wave-like flow line representing positive financial cashflow -->
  <path d="M 120 300 C 180 220, 200 340, 280 240 C 330 180, 350 260, 392 180" stroke="url(#flow-grad)" stroke-width="36" stroke-linecap="round" fill="none" filter="url(#shadow)" />
  <circle cx="392" cy="180" r="18" fill="#8b5cf6" />
  <circle cx="120" cy="300" r="18" fill="#10b981" />
</svg>